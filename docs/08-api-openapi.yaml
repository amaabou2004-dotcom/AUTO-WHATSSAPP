      properties:
        all:
          type: array
          items:
            type: object
            required: [field, op]
            properties:
              field: { type: string, enum: [tag, consent, status, country, locale, created_at, last_interaction_at, custom_field, message_count] }
              op: { type: string, enum: [eq, neq, in, not_in, gt, lt, between, exists] }
