name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  quality:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification des types
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests (dont migrations sous PGlite)
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Format (informatif)
        run: pnpm run format:check
        continue-on-error: true

  contracts:
    name: Contrat OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider docs/08-api-openapi.yaml
        run: bash scripts/validate-openapi.sh

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scanner les fichiers suivis
        run: node scripts/scan-secrets.mjs
